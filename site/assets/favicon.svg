<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Leonida Sub TH</title>
  <!-- concept C: monogram "L" + subtitle bars. Gradient tile + light inner stroke so it
       stays visible on dark taskbars/tabs. Sizes <= 32px use leonida-sub-th-small.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2b52"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#7fb0ff" stroke-opacity="0.4" stroke-width="1"/>
  <g transform="translate(-1 0.5)">
    <path d="M18 12 V40 H32" fill="none" stroke="#eef2fb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="35" width="14" height="6" rx="3" fill="#7fb0ff"/>
    <rect x="14" y="48" width="38" height="6" rx="3" fill="#2563eb"/>
  </g>
</svg>
